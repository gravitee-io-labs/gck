# Composed by --enable-kafka-gateway (gck--enable-kafka-gateway.yaml): the
# notes that replace the broker's own instructions, and the certificate the
# gateway presents to Kafka clients. The apim values live in the flag itself,
# which is applied after apim/base.
abstract: true
components:
  - name: kafka-tls
    type: k8s
    namespace: gravitee
    k8s:
      manifests:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: kafka-tls
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
