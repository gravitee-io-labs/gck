description: "No datasource: the gateway runs DB-less, configured from Kubernetes resources through GKO"
group: datasource
from:
  - gravitee-io/gko
implies:
  - disable-ui
  - disable-analytics
images:
  preload:
    skip:
      - "{{ .imagePrefix }}/apim-management-api:{{ .imageTag }}-debian"
      - alpine:latest
components:
  - name: tls-server
    enabled: false
  - name: apim
    helm:
      values:
        api:
          enabled: false
        ratelimit:
          type: none
        gateway:
          replicaCount: 1
          autoscaling:
            enabled: false
          dbLess: true
          servers:
            - type: http
              port: 8082
              service:
                type: NodePort
                nodePort: 30082
                externalPort: 82
              ingress:
                enabled: false
          service:
            type: NodePort
            nodePort: 30082
  - name: gko
    helm:
      values:
        manager:
          scope:
            cluster: false
