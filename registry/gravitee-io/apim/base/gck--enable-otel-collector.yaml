description: "Export gateway OpenTelemetry traces to a composed otel-collector"
components:
  - name: apim
    helm:
      values:
        gateway:
          env:
            - name: gravitee_services_opentelemetry_enabled
              value: "true"
            - name: gravitee_services_opentelemetry_exporter_endpoint
              value: "http://otel-collector.observability.svc.cluster.local:4317"
