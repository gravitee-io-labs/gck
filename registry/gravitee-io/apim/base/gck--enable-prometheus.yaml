description: "Deploy Prometheus and enable APIM metrics"
vars:
  prometheusImageRepository:
    default: "prom/prometheus"
    description: "Prometheus Docker image repository"
  prometheusImageTag:
    default: "v3.4.1"
    description: "Prometheus Docker image tag"
images:
  preload:
    refs:
      - "{{ .prometheusImageRepository }}:{{ .prometheusImageTag }}"
components:
  - name: prometheus
    type: k8s
    namespace: gravitee
    conditions:
      ready: true
    selector:
      matchLabels:
        app: prometheus
    k8s:
      manifests:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: prometheus-config
            labels:
              app: prometheus
          data:
            prometheus.yml: |
              global:
                scrape_interval: 15s
              scrape_configs:
                - job_name: prometheus
                  static_configs:
                    - targets: ["localhost:9090"]
                # The gateway serves Prometheus metrics on its technical
                # API, not on /metrics, behind the chart's default Basic auth.
                - job_name: apim-gateway
                  metrics_path: /_node/metrics/prometheus
                  basic_auth:
                    username: admin
                    password: adminadmin
                  static_configs:
                    - targets: ["apim-gateway:18082"]
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: prometheus
            labels:
              app: prometheus
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: prometheus
            template:
              metadata:
                labels:
                  app: prometheus
              spec:
                containers:
                  - name: prometheus
                    image: "{{ .prometheusImageRepository }}:{{ .prometheusImageTag }}"
                    args:
                      - "--config.file=/etc/prometheus/prometheus.yml"
                      - "--storage.tsdb.retention.time=2h"
                      - "--storage.tsdb.retention.size=256MB"
                    ports:
                      - containerPort: 9090
                        name: http
                    volumeMounts:
                      - name: config
                        mountPath: /etc/prometheus
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
                volumes:
                  - name: config
                    configMap:
                      name: prometheus-config
        - apiVersion: v1
          kind: Service
          metadata:
            name: prometheus
            labels:
              app: prometheus
          spec:
            type: ClusterIP
            ports:
              - port: 9090
                targetPort: 9090
                name: http
            selector:
              app: prometheus
  - name: apim
    helm:
      values:
        gateway:
          services:
            metrics:
              enabled: true
              prometheus:
                enabled: true
            # The chart serves the technical API (18082) on the pod only;
            # this adds the port to the gateway Service Prometheus scrapes.
            core:
              service:
                enabled: true
                externalPort: 18082
