abstract: true
vars:
  clusterName:
    default: "gravitee"
    description: "Name of the Kind cluster"
  imagePrefix:
    default: "graviteeio"
    description: "Docker image prefix for all AM components"
  helmVersion:
    default: ""
    description: "Helm chart version constraint"
  imageTag:
    default: "latest"
    description: "Docker image tag for all AM components"
images:
  preload:
    refs:
      - "{{ .imagePrefix }}/am-gateway:{{ .imageTag }}"
      - "{{ .imagePrefix }}/am-management-api:{{ .imageTag }}"
      - "{{ .imagePrefix }}/am-management-ui:{{ .imageTag }}"
      - alpine:latest
kind:
  name: "{{ .clusterName }}"
  nodes:
    - role: control-plane
      extraPortMappings:
        - containerPort: 30090
          hostPort: 30090
        - containerPort: 30092
          hostPort: 30092
        - containerPort: 30093
          hostPort: 30093
helm:
  repos:
    - name: graviteeio
      url: https://helm.gravitee.io
components:
  - name: tls-server
    type: k8s
    namespace: gravitee
    k8s:
      manifests:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-server
            namespace: gravitee
          type: kubernetes.io/tls
          data:
            tls.crt: :
            tls.key: 
  - name: am
    type: helm
    namespace: gravitee
    conditions:
      ready: true
    selector:
      matchLabels:
        app.kubernetes.io/instance: am
    requires:
      - component: tls-server
    helm:
      chart: graviteeio/am
      version: "{{ .helmVersion }}"
      values:
        ui:
          image:
            repository: "{{ .imagePrefix }}/am-management-ui"
            tag: "{{ .imageTag }}"
          baseURL: http://localhost:30093/management
          ingress:
            enabled: false
        gateway:
          image:
            repository: "{{ .imagePrefix }}/am-gateway"
            tag: "{{ .imageTag }}"
          ingress:
            enabled: false
        api:
          image:
            repository: "{{ .imagePrefix }}/am-management-api"
            tag: "{{ .imageTag }}"
          ingress:
            enabled: false
          automation:
            enabled: true
            entrypoint: /automation
          env:
            - name: gravitee_http_api_automation_enabled
              value: "true"
  - name: am-nodeports
    type: k8s
    namespace: gravitee
    requires:
      - component: am
    k8s:
      manifests:
        - apiVersion: v1
          kind: Service
          metadata:
            name: am-ui-nodeport
          spec:
            type: NodePort
            ports:
              - port: 8080
                targetPort: 8080
                nodePort: 30090
            selector:
              app.kubernetes.io/instance: am
              app.kubernetes.io/component: management-ui
        - apiVersion: v1
          kind: Service
          metadata:
            name: am-gateway-nodeport
          spec:
            type: NodePort
            ports:
              - port: 8092
                targetPort: 8092
                nodePort: 30092
            selector:
              app.kubernetes.io/instance: am
              app.kubernetes.io/component: gateway
        - apiVersion: v1
          kind: Service
          metadata:
            name: am-api-nodeport
          spec:
            type: NodePort
            ports:
              - port: 8093
                targetPort: 8093
                nodePort: 30093
            selector:
              app.kubernetes.io/instance: am
              app.kubernetes.io/component: management-api
