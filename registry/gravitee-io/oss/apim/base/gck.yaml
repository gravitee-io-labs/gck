abstract: true
vars:
  clusterName:
    default: "gravitee"
    description: "Name of the Kind cluster"
  imagePrefix:
    default: "graviteeio"
    description: "Docker image prefix for all APIM components"
  helmVersion:
    default: ""
    description: "Helm chart version constraint"
  imageTag:
    default: "latest"
    description: "Docker image tag for all APIM components"
images:
  preload:
    refs:
      - "{{ .imagePrefix }}/apim-gateway:{{ .imageTag }}-debian"
      - "{{ .imagePrefix }}/apim-management-api:{{ .imageTag }}-debian"
      - "{{ .imagePrefix }}/apim-management-ui:{{ .imageTag }}"
      - "{{ .imagePrefix }}/apim-portal-ui:{{ .imageTag }}"
      - alpine:latest
kind:
  name: "{{ .clusterName }}"
  nodes:
    - role: control-plane
      extraPortMappings:
        - containerPort: 30080
          hostPort: 30080
        - containerPort: 30081
          hostPort: 30081
        - containerPort: 30082
          hostPort: 30082
        - containerPort: 30083
          hostPort: 30083
        - containerPort: 30084
          hostPort: 30084
helm:
  repos:
    - name: graviteeio
      url: https://helm.gravitee.io
components:
  - name: tls-server
    type: k8s
    namespace: gravitee
    k8s:
      manifests:
        - apiVersion: v1
          kind: Secret
          metadata:
            name: tls-server
            namespace: gravitee
          type: kubernetes.io/tls
          data:
            tls.crt: 
            tls.key: 
  - name: apim
    type: helm
    namespace: gravitee
    conditions:
      ready: true
    timeout: 15m
    selector:
      matchLabels:
        app.kubernetes.io/instance: apim
    requires:
      - component: tls-server
    helm:
      chart: graviteeio/apim
      version: "{{ .helmVersion }}"
      values:
        secrets:
          kubernetes:
            enabled: true
        es:
          endpoints:
            - http://elasticsearch-master:9200
        ui:
          image:
            repository: "{{ .imagePrefix }}/apim-management-ui"
            tag: "{{ .imageTag }}"
          ingress:
            enabled: false
          service:
            type: NodePort
            nodePort: 30080
          baseURL: http://localhost:30083/management
          env:
            - name: CONSOLE_BASE_HREF
              value: /
        portal:
          image:
            repository: "{{ .imagePrefix }}/apim-portal-ui"
            tag: "{{ .imageTag }}"
          enabled: true
          ingress:
            enabled: false
          service:
            type: NodePort
            nodePort: 30081
          baseURL: http://localhost:30083/portal
        gateway:
          image:
            repository: "{{ .imagePrefix }}/apim-gateway"
            tag: "{{ .imageTag }}-debian"
          ingress:
            enabled: false
          ingressController:
            enabled: true
          servers:
            - type: http
              port: 8082
              service:
                type: NodePort
                nodePort: 30082
                externalPort: 82
              ingress:
                enabled: false
            - type: http
              port: 8084
              service:
                type: NodePort
                nodePort: 30084
                externalPort: 84
              ingress:
                enabled: false
              ssl:
                keystore:
                  type: pem
                  secret: secret://kubernetes/tls-server
                clientAuth: request
          service:
            type: NodePort
          services:
            sync:
              kubernetes:
                enabled: true
          reporters:
            elasticsearch:
              enabled: true
        api:
          image:
            repository: "{{ .imagePrefix }}/apim-management-api"
            tag: "{{ .imageTag }}-debian"
          ingress:
            enabled: false
          service:
            type: NodePort
            nodePort: 30083
        installation:
          api:
            url: http://localhost:30083
            proxyPath:
              management: /management
              portal: /portal
