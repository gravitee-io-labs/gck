vars:
  clusterName:
    default: "gravitee"
    description: "Name of the Kind cluster"
  imageRepository:
    default: "graviteeio/kubernetes-operator"
    description: "GKO Docker image repository"
  imageTag:
    default: "latest"
    description: "GKO Docker image tag"
  helmVersion:
    default: ""
    description: "Helm chart version constraint"
  helmChartLocator:
    default: "graviteeio/gko"
    description: "Helm chart reference: repo/chart, oci://registry/path/chart, a path or a URL. An OCI chart needs an explicit helmVersion"
images:
  preload:
    refs:
      - "{{ .imageRepository }}:{{ .imageTag }}"
kind:
  name: "{{ .clusterName }}"
helm:
  repos:
    - name: graviteeio
      url: https://helm.gravitee.io
components:
  - name: gko
    type: helm
    namespace: gravitee
    helm:
      chart: "{{ .helmChartLocator }}"
      version: "{{ .helmVersion }}"
      values:
        manager:
          image:
            repository: "{{ .imageRepository }}"
            tag: "{{ .imageTag }}"
