# mockpit stands in for Gravitee Cockpit so AM and APIM can run as
# multi-tenant installations in CI: it seeds every installation that connects
# with built-in organizations and environments, and signs browsers in through
# Cockpit SSO. See https://github.com/gravitee-io-labs/mockpit.
#
# Abstract and README-less on purpose: this is internal CI tooling, so it gets
# no registry page, and it only makes sense composed with the AM and APIM it
# serves. The composing stack points their cloud connector at
# http://mockpit.gravitee.svc.cluster.local:8085 and mounts mockpit's built-in
# keystore.
#
# It declares no features, routes or patches on other components: features
# blocks replace each other whole on merge, and product component names
# differ between contexts (gamma vs apim).
abstract: true
vars:
  imageRepository:
    default: "graviteeio.azurecr.io/mockpit"
    description: "mockpit image repository"
  imageTag:
    default: "main"
    description: "mockpit image tag: main follows the main branch, X.Y.Z a release"
  seedDelay:
    default: "20s"
    description: "Wait between an installation's HELLO and the seed of the built-in tenants, so its startup upgraders run first"
  gatewayHostTemplate:
    default: "{environment}.{organization}.{account}.test"
    description: "GATEWAY host of each built-in environment for an installation whose HELLO carries no access point template (AM 4.12), which binds its domains to it; AM 4.13 and later send their own. Placeholders {organization}, {environment}, {account}"
  defaultEnvironmentAccessPoints:
    default: ""
    description: "Comma-separated access point targets, e.g. PORTAL, that every APIM seed gives APIM's own DEFAULT environment from its access point template; multi-tenant APIM resolves an environment's portal URL from its PORTAL access point only. Leave GATEWAY out: it restricts DEFAULT's APIs without a virtual host to that gateway host. Empty leaves DEFAULT alone"
  amNodeUrl:
    default: ""
    description: "AM management node API, /_node included; when set, every AM seed ends by creating one data plane per built-in environment, as the cloud does for a managed AM (4.13 and later)"
  amDataPlaneConfiguration:
    default: ""
    description: "Connection settings of those data planes, a JSON object, e.g. {\"mongodb\":{\"uri\":\"mongodb://mongodb:27017/am\"}}; required with amNodeUrl"
  apolloLicenseFile:
    default: ""
    description: "Licence file of the apollo organization on APIM, in place of the platform licence; gck patch --set swaps it without restarting APIM"
  artemisLicenseFile:
    default: ""
    description: "Licence file of the artemis organization on APIM, in place of the platform licence; gck patch --set swaps it without restarting APIM"
images:
  preload:
    refs:
      - "{{ .imageRepository }}:{{ .imageTag }}"
components:
  - name: mockpit
    type: k8s
    namespace: gravitee
    conditions:
      ready: true
    selector:
      matchLabels:
        app: mockpit
    k8s:
      # One Secret per organization: gck skips a whole Secret when one of
      # its files is missing. Both are optional in the volume below, so an
      # organization without a file keeps APIM's platform licence. The key
      # is license.key whatever the file is called.
      secrets:
        - name: mockpit-license-apollo
          onMissing: ignore
          entries:
            - key: license.key
              fromFile: "{{ .apolloLicenseFile }}"
        - name: mockpit-license-artemis
          onMissing: ignore
          entries:
            - key: license.key
              fromFile: "{{ .artemisLicenseFile }}"
      manifests:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mockpit
            labels:
              app: mockpit
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: mockpit
            template:
              metadata:
                labels:
                  app: mockpit
              spec:
                containers:
                  - name: mockpit
                    image: "{{ .imageRepository }}:{{ .imageTag }}"
                    args:
                      - "--seed-delay={{ .seedDelay }}"
                      - "--gateway-host-template={{ .gatewayHostTemplate }}"
                      # Passed only when set, so images without the flag still start. The
                      # template actions sit in comments to keep the raw file valid YAML.
                      # {{- if .defaultEnvironmentAccessPoints }}
                      - "--default-environment-access-points={{ .defaultEnvironmentAccessPoints }}"
                      # {{- end }}
                      # Empty by default, which leaves AM data planes off.
                      - "--am-node-url={{ .amNodeUrl }}"
                      - '--am-data-plane-configuration={{ .amDataPlaneConfiguration }}'
                      # Passed only when a licence is set, as above.
                      # {{- if or .apolloLicenseFile .artemisLicenseFile }}
                      - "--license-dir=/etc/mockpit/licenses"
                      # {{- end }}
                    ports:
                      - containerPort: 8085
                        name: http
                    # No subPath: a Secret updated by gck patch reaches the
                    # files, and mockpit sends the new licence on.
                    volumeMounts:
                      - name: licenses
                        mountPath: /etc/mockpit/licenses
                        readOnly: true
                    readinessProbe:
                      httpGet:
                        path: /healthz
                        port: 8085
                    resources:
                      requests:
                        cpu: 10m
                        memory: 16Mi
                      limits:
                        cpu: 200m
                        memory: 64Mi
                volumes:
                  - name: licenses
                    projected:
                      sources:
                        - secret:
                            name: mockpit-license-apollo
                            optional: true
                            items:
                              - key: license.key
                                path: apollo.key
                        - secret:
                            name: mockpit-license-artemis
                            optional: true
                            items:
                              - key: license.key
                                path: artemis.key
        - apiVersion: v1
          kind: Service
          metadata:
            name: mockpit
            labels:
              app: mockpit
          spec:
            type: ClusterIP
            ports:
              - port: 8085
                targetPort: 8085
                name: http
            selector:
              app: mockpit
