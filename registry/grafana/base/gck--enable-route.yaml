description: "Serve Grafana on a hostname via a Gateway API HTTPRoute and local DNS"
features:
  gateway:
    enabled: true
  dns:
    enabled: true
components:
  - name: grafana-route
    type: k8s
    namespace: "{{ .namespace }}"
    k8s:
      manifests:
        # Attaches to the gck-gateway that gck injects when features.gateway is
        # enabled. That Gateway lives in the default namespace and accepts
        # routes from all namespaces, so this works from observability.
        - apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: grafana
            labels:
              app: grafana
          spec:
            parentRefs:
              - name: gck-gateway
                namespace: default
            hostnames:
              - "{{ .hostname }}"
            rules:
              - backendRefs:
                  - name: grafana
                    port: 3000
